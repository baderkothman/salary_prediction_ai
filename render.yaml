# Render Blueprint for the independently deployed FastAPI service.
# Documents the config of the live service (created via Render's API);
# also usable to reproduce it via Render's "New Blueprint" flow.
services:
  - type: web
    name: salary-prediction-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
